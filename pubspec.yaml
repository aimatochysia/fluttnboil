name: fluttnboil
description: "FluttnBoil - A comprehensive Flutter SaaS boilerplate with authentication, RBAC, Stripe subscriptions, and clean architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management - Riverpod (primary) with Bloc support
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^17.0.0

  # Networking
  dio: ^5.9.0
  http: ^1.6.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Authentication & Security
  jwt_decoder: ^2.0.1

  # Dependency Injection
  get_it: ^9.1.1

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.2
  intl: ^0.20.2
  logger: ^2.4.0
  url_launcher: ^6.3.0

  # Services (kept for compatibility)
  stacked_services: ^0.8.26
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^2.4.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
